name: Portfolio QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Browser and Lighthouse verification
        run: node scripts/ci-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-qa
          path: qa-results/
